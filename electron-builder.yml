# Packaging: AppImage (Linux, primary) + NSIS installer (Windows x64).
# Sample libraries (Concerto, Studio Drums) are NOT bundled — they're downloadable content packs.
appId: com.elevchyt.arkanedaw
productName: ArkaneDAW
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icons
    to: icons
  - from: resources/native
    to: native
    filter: ['**/*']
asar: true
afterPack: scripts/release/after-pack.cjs
toolsets:
  # Static AppImage runtime: runs without libfuse2 on the host (the legacy "0.0.0" runtime needs it).
  # Its AppRun probes the Chromium sandbox and adds --no-sandbox only where it cannot work.
  appimage: '1.0.3'
linux:
  # AppStream metainfo (AppImage catalog, software centers). appstreamcli validate-tree needs the desktop file it
  # launches under usr/share/applications too; keep resources/linux/arkane-daw.desktop in sync with the generated
  # one at the AppImage root (Name, Comment = description, Categories = category).
  extraFiles:
    - from: resources/linux/com.elevchyt.arkanedaw.appdata.xml
      to: usr/share/metainfo/com.elevchyt.arkanedaw.appdata.xml
    - from: resources/linux/arkane-daw.desktop
      to: usr/share/applications/arkane-daw.desktop
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo;Audio;Midi;
  description: Pattern-based digital audio workstation
  icon: build/icons
  synopsis: Pattern-based DAW with an FL Studio-style workflow
  desktop:
    entry:
      Name: ArkaneDAW
      StartupWMClass: ArkaneDAW
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Built on Linux without Wine: skip rcedit/signing of the exe.
  signAndEditExecutable: false
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ArkaneDAW
publish:
  provider: github
  owner: elevchyt
  repo: ArkaneDAW
